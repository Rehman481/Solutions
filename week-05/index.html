<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Kit · Component Library</title>
    <style>
        /* ========================================
           CSS VARIABLES
           ======================================== */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #60a5fa;
            --secondary: #7c3aed;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --text-dark: #0b1e33;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: var(--text-dark);
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ----- Header ----- */
        header {
            text-align: center;
            padding: 2rem 0 3rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* ----- Demo Sections ----- */
        .demo-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .demo-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .demo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .demo-btn {
            padding: 0.6rem 1.5rem;
            background: var(--bg-light);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s var(--transition);
        }

        .demo-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* ========================================
           BUTTON COMPONENT
           ======================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(37, 99, 235, 0.35);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 2px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
        }

        .btn-success:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(34, 197, 94, 0.35);
        }

        .btn-danger {
            background: var(--error);
            color: white;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25);
        }

        .btn-danger:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(239, 68, 68, 0.35);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
        }

        .btn-warning:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 35px rgba(245, 158, 11, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
        }

        .btn-sm {
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
        }

        .btn-lg {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* ========================================
           CARD COMPONENT
           ======================================== */
        .card {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 1.5rem;
            transition: all 0.4s var(--transition);
            min-width: 220px;
            max-width: 320px;
            flex: 1;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .card-icon {
            font-size: 2rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-body {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .card-footer {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .card-variant-primary {
            border-top: 4px solid var(--primary);
        }

        .card-variant-secondary {
            border-top: 4px solid var(--secondary);
        }

        .card-variant-success {
            border-top: 4px solid var(--success);
        }

        .card-variant-danger {
            border-top: 4px solid var(--error);
        }

        .card-variant-warning {
            border-top: 4px solid var(--warning);
        }

        .card-hover {
            cursor: pointer;
        }

        /* ========================================
           MODAL COMPONENT
           ======================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.3s var(--transition);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.4s var(--transition);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius);
            transition: all 0.3s var(--transition);
        }

        .modal-close:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .modal-body {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .modal-footer {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }

        /* ========================================
           TOAST COMPONENT
           ======================================== */
        #toastContainer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            z-index: 2000;
            max-width: 400px;
            width: 100%;
            pointer-events: none;
        }

        #toastContainer .toast {
            pointer-events: auto;
        }

        .toast {
            background: white;
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            animation: toastSlideIn 0.4s var(--transition);
            border-left: 5px solid var(--primary);
            transition: all 0.3s var(--transition);
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastSlideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        .toast-out {
            animation: toastSlideOut 0.3s var(--transition) forwards;
        }

        .toast-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .toast-message {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .toast-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.2rem 0.4rem;
            border-radius: var(--radius);
            transition: all 0.3s var(--transition);
        }

        .toast-close:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .toast-success {
            border-left-color: var(--success);
        }

        .toast-error {
            border-left-color: var(--error);
        }

        .toast-warning {
            border-left-color: var(--warning);
        }

        .toast-info {
            border-left-color: var(--info);
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 2rem;
            }

            .demo-section {
                padding: 1.2rem;
            }

            .demo-grid {
                flex-direction: column;
                align-items: stretch;
            }

            .card {
                max-width: 100%;
            }

            .modal {
                padding: 1.5rem;
                margin: 1rem;
            }

            #toastContainer {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                max-width: 100%;
            }

            .demo-btn {
                width: 100%;
                text-align: center;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>🎨 UI Kit</h1>
            <p>Reusable components built with vanilla JS</p>
        </header>

        <main>
            <!-- Buttons Section -->
            <section class="demo-section">
                <h2>Buttons</h2>
                <div class="demo-grid" id="buttonContainer"></div>
            </section>

            <!-- Cards Section -->
            <section class="demo-section">
                <h2>Cards</h2>
                <div class="demo-grid" id="cardContainer"></div>
            </section>

            <!-- Modal Section -->
            <section class="demo-section">
                <h2>Modal</h2>
                <div class="demo-grid">
                    <button id="openModalBtn" class="demo-btn">🚀 Open Modal</button>
                </div>
                <div id="modalContainer"></div>
            </section>

            <!-- Toast Section -->
            <section class="demo-section">
                <h2>Toast Notifications</h2>
                <div class="demo-grid">
                    <button class="demo-btn toast-trigger" data-type="success">✅ Success</button>
                    <button class="demo-btn toast-trigger" data-type="error">❌ Error</button>
                    <button class="demo-btn toast-trigger" data-type="warning">⚠️ Warning</button>
                    <button class="demo-btn toast-trigger" data-type="info">ℹ️ Info</button>
                    <button id="stackToastsBtn" class="demo-btn">📚 Stack 3</button>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ========================================
        // UI KIT · Reusable Components
        // ========================================

        // ========================================
        // 1. BUTTON COMPONENT
        // ========================================
        function createButton({
            text = 'Button',
            variant = 'primary',
            size = 'md',
            onClick = null,
            disabled = false,
            icon = null
        } = {}) {
            const button = document.createElement('button');
            button.className = `btn btn-${variant} btn-${size}`;
            button.textContent = text;
            if (disabled) button.disabled = true;

            if (icon) {
                const iconSpan = document.createElement('span');
                iconSpan.textContent = icon;
                button.prepend(iconSpan);
            }

            if (onClick && typeof onClick === 'function') {
                button.addEventListener('click', onClick);
            }

            return button;
        }

        // ========================================
        // 2. CARD COMPONENT
        // ========================================
        function createCard({
            title = 'Card Title',
            content = 'Card content goes here.',
            icon = '📄',
            variant = 'primary',
            footer = null,
            hoverable = true
        } = {}) {
            const card = document.createElement('div');
            card.className = `card card-variant-${variant}`;
            if (hoverable) card.classList.add('card-hover');

            const header = document.createElement('div');
            header.className = 'card-header';

            const iconSpan = document.createElement('span');
            iconSpan.className = 'card-icon';
            iconSpan.textContent = icon;

            const titleEl = document.createElement('h3');
            titleEl.className = 'card-title';
            titleEl.textContent = title;

            header.appendChild(iconSpan);
            header.appendChild(titleEl);

            const body = document.createElement('div');
            body.className = 'card-body';
            body.textContent = content;

            card.appendChild(header);
            card.appendChild(body);

            if (footer) {
                const footerEl = document.createElement('div');
                footerEl.className = 'card-footer';

                if (Array.isArray(footer)) {
                    footer.forEach(item => footerEl.appendChild(item));
                } else {
                    footerEl.appendChild(footer);
                }

                card.appendChild(footerEl);
            }

            return card;
        }

        // ========================================
        // 3. MODAL COMPONENT
        // ========================================
        function createModal({
            title = 'Modal Title',
            content = 'Modal content goes here.',
            confirmText = 'Confirm',
            cancelText = 'Cancel',
            onConfirm = null,
            onCancel = null,
            onClose = null
        } = {}) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const modal = document.createElement('div');
            modal.className = 'modal';

            const header = document.createElement('div');
            header.className = 'modal-header';

            const titleEl = document.createElement('h2');
            titleEl.className = 'modal-title';
            titleEl.textContent = title;

            const closeBtn = document.createElement('button');
            closeBtn.className = 'modal-close';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', () => closeModal());

            header.appendChild(titleEl);
            header.appendChild(closeBtn);

            const body = document.createElement('div');
            body.className = 'modal-body';
            body.innerHTML = content;

            const footer = document.createElement('div');
            footer.className = 'modal-footer';

            const cancelBtn = createButton({
                text: cancelText,
                variant: 'secondary',
                onClick: () => {
                    if (onCancel && typeof onCancel === 'function') onCancel();
                    closeModal();
                }
            });

            const confirmBtn = createButton({
                text: confirmText,
                variant: 'primary',
                onClick: () => {
                    if (onConfirm && typeof onConfirm === 'function') onConfirm();
                    closeModal();
                }
            });

            footer.appendChild(cancelBtn);
            footer.appendChild(confirmBtn);

            modal.appendChild(header);
            modal.appendChild(body);
            modal.appendChild(footer);
            overlay.appendChild(modal);

            function closeModal() {
                overlay.remove();
                document.body.style.overflow = '';
                if (onClose && typeof onClose === 'function') onClose();
            }

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal();
            });

            document.addEventListener('keydown', function handleEsc(e) {
                if (e.key === 'Escape') {
                    closeModal();
                    document.removeEventListener('keydown', handleEsc);
                }
            });

            function openModal() {
                document.body.appendChild(overlay);
                document.body.style.overflow = 'hidden';
            }

            return {
                open: openModal,
                close: closeModal
            };
        }

        // ========================================
        // 4. TOAST COMPONENT
        // ========================================
        function createToast({
            title = 'Notification',
            message = 'This is a toast message.',
            type = 'info',
            duration = 4000,
            icon = null,
            onClose = null
        } = {}) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const iconMap = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };

            const toastIcon = document.createElement('span');
            toastIcon.className = 'toast-icon';
            toastIcon.textContent = icon || iconMap[type] || 'ℹ️';

            const content = document.createElement('div');
            content.className = 'toast-content';

            const titleEl = document.createElement('div');
            titleEl.className = 'toast-title';
            titleEl.textContent = title;

            const messageEl = document.createElement('div');
            messageEl.className = 'toast-message';
            messageEl.textContent = message;

            content.appendChild(titleEl);
            content.appendChild(messageEl);

            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', () => removeToast());

            toast.appendChild(toastIcon);
            toast.appendChild(content);
            toast.appendChild(closeBtn);

            container.appendChild(toast);

            let timeoutId = null;

            function removeToast() {
                toast.classList.add('toast-out');
                setTimeout(() => {
                    toast.remove();
                    if (onClose && typeof onClose === 'function') onClose();
                }, 300);
            }

            if (duration > 0) {
                timeoutId = setTimeout(() => {
                    removeToast();
                }, duration);
            }

            toast.addEventListener('mouseenter', () => {
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            });

            toast.addEventListener('mouseleave', () => {
                if (duration > 0 && !timeoutId) {
                    timeoutId = setTimeout(() => {
                        removeToast();
                    }, duration);
                }
            });

            return {
                remove: removeToast,
                element: toast
            };
        }

        // ========================================
        // DEMO · Render Components
        // ========================================

        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            // ----- 1. Render Buttons -----
            const buttonContainer = document.getElementById('buttonContainer');
            const buttonConfigs = [
                { text: 'Primary', variant: 'primary' },
                { text: 'Secondary', variant: 'secondary' },
                { text: 'Success', variant: 'success' },
                { text: 'Danger', variant: 'danger' },
                { text: 'Warning', variant: 'warning' },
                { text: 'Outline', variant: 'outline' },
                { text: 'Small', variant: 'primary', size: 'sm' },
                { text: 'Large', variant: 'primary', size: 'lg' },
                { text: 'With Icon', variant: 'primary', icon: '🚀' },
            ];

            buttonConfigs.forEach(config => {
                const btn = createButton({
                    ...config,
                    onClick: () => {
                        createToast({
                            title: 'Button Clicked',
                            message: `You clicked the "${config.text}" button!`,
                            type: 'info'
                        });
                    }
                });
                buttonContainer.appendChild(btn);
            });

            // ----- 2. Render Cards -----
            const cardContainer = document.getElementById('cardContainer');
            const cardConfigs = [{
                title: 'Getting Started',
                content: 'Learn the basics and set up your first project in minutes.',
                icon: '🚀',
                variant: 'primary'
            }, {
                title: 'Documentation',
                content: 'Comprehensive guides and API references for all features.',
                icon: '📚',
                variant: 'secondary'
            }, {
                title: 'Community',
                content: 'Join thousands of developers building amazing things together.',
                icon: '👥',
                variant: 'success'
            }, {
                title: 'Support',
                content: 'Get help from our team and community around the clock.',
                icon: '💬',
                variant: 'danger'
            }];

            cardConfigs.forEach(config => {
                const card = createCard({
                    ...config,
                    footer: createButton({
                        text: 'Learn More',
                        variant: 'primary',
                        size: 'sm',
                        onClick: () => {
                            createToast({
                                title: 'Card Action',
                                message: `You clicked "${config.title}" card.`,
                                type: 'info'
                            });
                        }
                    })
                });
                cardContainer.appendChild(card);
            });

            // ----- 3. Modal Demo -----
            const openModalBtn = document.getElementById('openModalBtn');

            openModalBtn.addEventListener('click', () => {
                const modal = createModal({
                    title: 'Welcome to UI Kit',
                    content: `
                            <p>This is a reusable modal component built with vanilla JavaScript.</p>
                            <p style="margin-top: 0.8rem; color: var(--text-muted);">
                                ✨ Features: open/close, click outside to close, Escape key support,
                                and customizable buttons with callbacks.
                            </p>
                        `,
                    confirmText: 'Got it!',
                    cancelText: 'Close',
                    onConfirm: () => {
                        createToast({
                            title: 'Modal Confirmed',
                            message: 'You confirmed the modal action!',
                            type: 'success'
                        });
                    },
                    onCancel: () => {
                        createToast({
                            title: 'Modal Cancelled',
                            message: 'You cancelled the modal action.',
                            type: 'info'
                        });
                    }
                });
                modal.open();
            });

            // ----- 4. Toast Demo -----
            const toastTriggers = document.querySelectorAll('.toast-trigger');
            const toastMessages = {
                success: { title: 'Success!', message: 'Operation completed successfully.', type: 'success' },
                error: { title: 'Error!', message: 'Something went wrong. Please try again.', type: 'error' },
                warning: { title: 'Warning!', message: 'Please review your inputs before submitting.', type: 'warning' },
                info: { title: 'Info', message: 'This is an informational message.', type: 'info' }
            };

            toastTriggers.forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    const msg = toastMessages[type] || toastMessages.info;
                    createToast({
                        title: msg.title,
                        message: msg.message,
                        type: msg.type,
                        duration: 4000
                    });
                });
            });

            // ----- 5. Stack Toasts -----
            document.getElementById('stackToastsBtn').addEventListener('click', () => {
                const types = ['success', 'error', 'warning', 'info'];
                const messages = [
                    { title: 'First Toast', message: 'This is the first toast in the stack.' },
                    { title: 'Second Toast', message: 'This is the second toast, stacking naturally.' },
                    { title: 'Third Toast', message: 'This is the third toast! They stack vertically.' }
                ];

                messages.forEach((msg, index) => {
                    setTimeout(() => {
                        createToast({
                            title: msg.title,
                            message: msg.message,
                            type: types[index % types.length],
                            duration: 5000
                        });
                    }, index * 400);
                });
            });

            console.log('🎨 UI Kit loaded successfully!');
            console.log('📦 Components: Button, Card, Modal, Toast');
            console.log('💡 Try clicking the demo components above!');
        });

        // ========================================
        // EXPOSE COMPONENTS TO CONSOLE FOR TESTING
        // ========================================
        window.UIKit = {
            createButton,
            createCard,
            createModal,
            createToast
        };
    </script>
</body>
</html>
